<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="diamond" aria-hidden="true"></span>
        <div>
          <strong>Vela</strong>
          <span>late night dial</span>
        </div>
      </div>
      <p class="hint">This is the desk. The terminal is the <code>vela</code> command.</p>
    </header>
    <main>
      <section class="dial">
        <div class="filters">
          <input id="q" type="search" placeholder="Search the dial" aria-label="Search stations" />
          <input id="place" type="text" placeholder="Place" aria-label="Country or place" />
        </div>
        <div id="genres" class="genres"></div>
        <div class="scopes">
          <button type="button" data-scope="dial" class="on">Dial</button>
          <button type="button" data-scope="saved">Saved</button>
          <button type="button" data-scope="mine">Mine</button>
          <button type="button" id="open-add" class="ghost">Add</button>
        </div>
        <div id="list" class="list" role="listbox" aria-label="Stations"></div>
      </section>
      <aside class="stage">
        <p id="eyebrow" class="eyebrow">QUIET</p>
        <p id="mark" class="mark">·</p>
        <h1 id="title">Nothing on the air</h1>
        <p id="meta" class="meta">Choose a station. Star the ones you want to keep.</p>
        <p id="err" class="err" hidden></p>
        <div class="transport">
          <button type="button" id="prev" aria-label="Previous station">Prev</button>
          <button type="button" id="play" class="play" aria-label="Play">Play</button>
          <button type="button" id="next" aria-label="Next station">Next</button>
        </div>
        <label class="vol">
          <span id="vol-label">82</span>
          <input id="vol" type="range" min="0" max="100" value="82" aria-label="Volume" />
        </label>
        <button type="button" id="sleep" class="ghost">Sleep off</button>
      </aside>
    </main>
    <form id="add" class="sheet" hidden>
      <div class="card">
        <h2>Add a stream</h2>
        <label>Name <input id="add-name" required maxlength="120" /></label>
        <label>Stream address <input id="add-url" required placeholder="https://" /></label>
        <p id="add-err" class="err" hidden></p>
        <div class="row">
          <button type="submit" class="solid">Put it on the dial</button>
          <button type="button" id="add-cancel" class="ghost">Cancel</button>
        </div>
      </div>
    </form>
    <audio id="audio" preload="none"></audio>
    <script src="/app.js"></script>
  </body>
</html>
